<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <radialGradient id="utopiaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.0"/>
    </radialGradient>
    <linearGradient id="paretoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="950" height="480" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="38" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">
    Multi-Criteria Decision Analysis: Pareto Knee Point &amp; Utopia Distance
  </text>
  <text x="40" y="56" font-family="-apple-system, sans-serif" font-size="12" fill="#64748B">
    Normalized Euclidean Distance: Di = √[(1.0 - c*)² + (k* - 0.0)²] · No Arbitrary Weights · Safety Refusal Disqualification
  </text>

  <!-- Axes: Left=120, Right=850 (Width=730), Top=90, Bottom=400 (Height=310) -->
  <!-- Y Axis: Comfort Ratio 0% (Y=400) to 100% (Y=100) -->
  <!-- X Axis: Capital Cost ₹0 (X=140) to ₹5,00,000 (X=820) -->

  <!-- Axes lines -->
  <line x1="140" y1="90" x2="140" y2="400" stroke="#475569" stroke-width="2"/>
  <line x1="140" y1="400" x2="840" y2="400" stroke="#475569" stroke-width="2"/>

  <!-- Axis Labels -->
  <text x="130" y="95" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F172A">
    Thermal Comfort Ratio (c*)
  </text>
  <text x="840" y="430" text-anchor="end" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#0F172A">
    Capital Cost (k*) [₹ INR]
  </text>

  <!-- Horizontal Grid Lines for Comfort -->
  <g font-family="monospace" font-size="10" fill="#64748B">
    <line x1="140" y1="100" x2="840" y2="100" stroke="#CBD5E1" stroke-dasharray="3,3"/>
    <text x="130" y="104" text-anchor="end">100% (1.0)</text>

    <line x1="140" y1="175" x2="840" y2="175" stroke="#E2E8F0" stroke-dasharray="3,3"/>
    <text x="130" y="179" text-anchor="end">75% (0.75)</text>

    <line x1="140" y1="250" x2="840" y2="250" stroke="#E2E8F0" stroke-dasharray="3,3"/>
    <text x="130" y="254" text-anchor="end">50% (0.50)</text>

    <line x1="140" y1="325" x2="840" y2="325" stroke="#E2E8F0" stroke-dasharray="3,3"/>
    <text x="130" y="329" text-anchor="end">25% (0.25)</text>

    <text x="130" y="404" text-anchor="end">0% (0.0)</text>
  </g>

  <!-- Vertical Grid Lines for Cost -->
  <g font-family="monospace" font-size="10" fill="#64748B" text-anchor="middle">
    <line x1="140" y1="90" x2="140" y2="400" stroke="#E2E8F0" stroke-dasharray="2,2"/>
    <text x="140" y="418">₹0</text>

    <line x1="310" y1="90" x2="310" y2="400" stroke="#E2E8F0" stroke-dasharray="2,2"/>
    <text x="310" y="418">₹1,25,000</text>

    <line x1="480" y1="90" x2="480" y2="400" stroke="#E2E8F0" stroke-dasharray="2,2"/>
    <text x="480" y="418">₹2,50,000</text>

    <line x1="650" y1="90" x2="650" y2="400" stroke="#E2E8F0" stroke-dasharray="2,2"/>
    <text x="650" y="418">₹3,75,000</text>

    <line x1="820" y1="90" x2="820" y2="400" stroke="#E2E8F0" stroke-dasharray="2,2"/>
    <text x="820" y="418">₹5,00,000</text>
  </g>

  <!-- ========================================================================= -->
  <!-- UTOPIA POINT -->
  <!-- ========================================================================= -->
  <circle cx="140" cy="100" r="28" fill="url(#utopiaGlow)"/>
  <polygon points="140,88 143,96 151,96 145,101 147,109 140,104 133,109 135,101 129,96 137,96" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
  <rect x="156" y="86" width="160" height="26" rx="5" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="164" y="103" font-family="-apple-system, sans-serif" font-size="11" font-weight="800" fill="#92400E">
    Utopia Point (c*=1.0, k*=0.0)
  </text>

  <!-- Pareto Curve Overlay (Non-Dominated Frontier) -->
  <path d="M 230 360 C 260 300, 310 160, 420 138 C 550 120, 700 115, 800 112"
        fill="none" stroke="url(#paretoGrad)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- ========================================================================= -->
  <!-- CANDIDATE POINTS -->
  <!-- ========================================================================= -->

  <!-- Point 1: Uninsulated Cheap (Cold) -->
  <!-- Cost = ₹65,000 (X=230), Comfort = 13% (Y=360) -->
  <circle cx="230" cy="360" r="7" fill="#64748B" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="140" y1="100" x2="230" y2="360" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="245" y="365" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#475569">
    Design A: Uninsulated CGI Prefab (Di = 0.88)
  </text>

  <!-- Point 2: Super-Insulated Arctic (High Cost) -->
  <!-- Cost = ₹4,70,000 (X=780), Comfort = 96% (Y=112) -->
  <circle cx="780" cy="112" r="7" fill="#3B82F6" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="140" y1="100" x2="780" y2="112" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="630" y="98" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#1D4ED8">
    Design B: Arctic Heavy (Di = 0.94)
  </text>

  <!-- Point 3: BEST TRADE-OFF / PARETO KNEE POINT -->
  <!-- Cost = ₹1,90,000 (X=398), Comfort = 88% (Y=136) -->
  <!-- Distance Vector from Utopia: dx = 258, dy = 36 => Min Di = 0.28 -->
  <line x1="140" y1="100" x2="398" y2="136" stroke="#7C3AED" stroke-width="2.5"/>
  <circle cx="398" cy="136" r="10" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2.5"/>
  <circle cx="398" cy="136" r="15" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="3,3"/>

  <g transform="translate(360, 160)">
    <rect width="260" height="60" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="12" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="800" fill="#5B21B6">
      ⚖️ Design C: Best Trade-Off (Knee Point)
    </text>
    <text x="12" y="36" font-family="monospace" font-size="10" font-weight="700" fill="#6D28D9">
      Min Utopia Distance: Di = 0.281
    </text>
    <text x="12" y="50" font-family="-apple-system, sans-serif" font-size="10" fill="#4B5563">
      Comfort: 88.0% (+17.2°C) · Cost: ₹1,90,000 (SOURCED)
    </text>
  </g>

  <!-- Point 4: DISQUALIFIED HAZARDOUS DESIGN -->
  <!-- Low ACH (<0.35) with Combustion Heater -->
  <!-- Cost = ₹70,000 (X=235), Comfort = 95% (Y=115) -->
  <g transform="translate(235, 115)">
    <circle cx="0" cy="0" r="9" fill="#FEE2E2" stroke="#EF4444" stroke-width="2"/>
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="#EF4444" stroke-width="2"/>
    <line x1="5" y1="-5" x2="-5" y2="5" stroke="#EF4444" stroke-width="2"/>

    <rect x="-80" y="-45" width="220" height="38" rx="6" fill="#FEF2F2" stroke="#EF4444"/>
    <text x="-72" y="-28" font-family="-apple-system, sans-serif" font-size="10.5" font-weight="800" fill="#991B1B">
      ✕ DISQUALIFIED: REFUSED
    </text>
    <text x="-72" y="-14" font-family="-apple-system, sans-serif" font-size="9.5" fill="#7F1D1D">
      ACH 0.20 + Kerosene = Lethal CO Hazard
    </text>
  </g>
</svg>
