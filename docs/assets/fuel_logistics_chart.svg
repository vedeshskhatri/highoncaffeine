<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 420" width="100%" height="100%">
  <defs>
    <linearGradient id="keroseneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="savingsGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="950" height="420" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Header -->
  <text x="40" y="38" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F172A">
    High-Altitude Fuel Logistics &amp; Defense Economic Payoff
  </text>
  <text x="40" y="56" font-family="-apple-system, sans-serif" font-size="12" fill="#64748B">
    Siachen Forward Post Economics · ₹2,400 per Litre Helicopter Airlift Delivery Cost · 15-Man Post Annual Basis
  </text>

  <!-- Container Box 1: Airlift Cost Anatomy (X=40 to X=280) -->
  <g transform="translate(40, 85)">
    <rect width="250" height="300" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="16" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A">
      1 L Kerosene Delivery Cost
    </text>
    <text x="16" y="40" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B">
      Total Cost to High Ridge: ₹2,400 / L
    </text>

    <!-- Stacked Bar for ₹2,400 -->
    <!-- Scale: ₹2,400 = 180px => 1px = ₹13.33 -->
    <rect x="25" y="60" width="80" height="175" rx="4" fill="#C2410C"/>
    <rect x="25" y="230" width="80" height="5" rx="1" fill="#EA580C"/>

    <text x="120" y="140" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#9A3412">
      Helicopter Airlift
    </text>
    <text x="120" y="156" font-family="monospace" font-size="12" font-weight="800" fill="#7C2D12">
      ₹2,330 / L (97%)
    </text>
    <text x="120" y="172" font-family="-apple-system, sans-serif" font-size="10" fill="#64748B">
      Mi-17 / Cheetah Rotor-Hours
    </text>

    <text x="120" y="228" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#0F172A">
      Base Fuel Cost
    </text>
    <text x="120" y="244" font-family="monospace" font-size="11" font-weight="700" fill="#475569">
      ₹70 / L (3%)
    </text>
  </g>

  <!-- Container Box 2: Annual Fuel Consumption per Post (X=315 to X=615) -->
  <g transform="translate(315, 85)">
    <rect width="290" height="300" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="16" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A">
      Annual Fuel Burn per Post
    </text>
    <text x="16" y="40" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B">
      15-Man Forward Bunker Heating
    </text>

    <!-- Bar 1: Baseline 1,350 L (Height: 180px) -->
    <rect x="35" y="65" width="80" height="180" rx="6" fill="#EF4444"/>
    <text x="75" y="60" text-anchor="middle" font-family="monospace" font-size="12" font-weight="800" fill="#991B1B">
      1,350 L
    </text>
    <text x="75" y="265" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">
      Standard Prefab
    </text>

    <!-- Bar 2: THERMA Optimized 170 L (Height: 23px) -->
    <rect x="155" y="222" width="80" height="23" rx="4" fill="#10B981"/>
    <text x="195" y="215" text-anchor="middle" font-family="monospace" font-size="12" font-weight="800" fill="#047857">
      170 L
    </text>
    <text x="195" y="265" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#047857">
      THERMA Shelter
    </text>

    <!-- Reduction Callout -->
    <rect x="30" y="275" width="230" height="16" rx="3" fill="#D1FAE5"/>
    <text x="145" y="287" text-anchor="middle" font-family="monospace" font-size="10" font-weight="700" fill="#065F46">
      ▼ 1,180 Litres / year Saved (-87.4%)
    </text>
  </g>

  <!-- Container Box 3: Annual Financial Outlay per Post (X=630 to X=910) -->
  <g transform="translate(630, 85)">
    <rect width="280" height="300" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="16" y="24" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0F172A">
      Annual Heating Outlay per Post
    </text>
    <text x="16" y="40" font-family="-apple-system, sans-serif" font-size="11" fill="#64748B">
      Direct Savings per Shelter Unit
    </text>

    <!-- Bar 1: Baseline ₹32.4 Lakh (Height: 180px) -->
    <rect x="30" y="65" width="80" height="180" rx="6" fill="#F87171"/>
    <text x="70" y="60" text-anchor="middle" font-family="monospace" font-size="12" font-weight="800" fill="#991B1B">
      ₹32.4 Lakh
    </text>
    <text x="70" y="265" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569">
      Annual Fuel Bill
    </text>

    <!-- Bar 2: THERMA Optimized ₹4.1 Lakh (Height: 23px) -->
    <rect x="150" y="222" width="80" height="23" rx="4" fill="url(#savingsGrad)"/>
    <text x="190" y="215" text-anchor="middle" font-family="monospace" font-size="12" font-weight="800" fill="#047857">
      ₹4.1 Lakh
    </text>
    <text x="190" y="265" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#047857">
      With THERMA
    </text>

    <!-- Payback Badge -->
    <rect x="25" y="275" width="230" height="16" rx="3" fill="#FEF3C7"/>
    <text x="140" y="287" text-anchor="middle" font-family="monospace" font-size="10" font-weight="800" fill="#92400E">
      ★ Net Savings: ₹28.32 Lakh / year
    </text>
  </g>
</svg>
